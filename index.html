<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학 논술 - 논숲</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<style>
  /* ===== 디자인 토큰 (nonsup.com/university 실측값) ===== */
  :root {
    --bg-page: #F8FAF8;
    --bg-primary: #FFFFFF;
    --bg-secondary: #F9FAFB;
    --text-primary: #111827;
    --text-secondary: #4B5563;
    --text-tertiary: #6B7280;
    --text-disabled: #9CA3AF;
    --border-primary: #E5E7EB;
    --border-strong: #9CA3AF;
    --brand: #008B48;
    --brand-hover: #007A3F;
    --brand-subtle: #EEF8F2;
    --info-subtle: #EEF5FD;
    --info: #1D6FD1;
    --warn-subtle: #FFF4E5;
    --warn: #D97706;
    --heart: #EF4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }
  ul { list-style: none; }
  [hidden] { display: none !important; }

  .container { max-width: 1264px; margin: 0 auto; padding: 50px 32px 48px; }

  /* ===== 상단 메뉴 (GNB) ===== */
  /* nonsup.com 실측값 그대로 */
  .gnb { position: sticky; top: 0; z-index: 100; height: 80px; background: var(--bg-primary); border-bottom: 1px solid #F1F5F9; }
  .gnb-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 1200px; height: 100%; margin: 0 auto; padding: 0 24px; }
  .logo { display: flex; align-items: flex-start; gap: 6px; justify-self: start; cursor: pointer; font-family: SUIT, Pretendard, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.22px; line-height: normal; color: var(--text-primary); }
  .gnb-menu { display: flex; align-items: center; align-self: stretch; gap: 48px; }
  .gnb-menu > li { position: relative; display: flex; align-items: center; height: 100%; }
  .gnb-link { display: flex; align-items: center; gap: 4px; padding: 10px 12px; font-size: 16px; font-weight: 500; line-height: 25.6px; color: var(--text-secondary); cursor: pointer; transition: color .15s; }
  .gnb-link:hover, .gnb-menu > li.on .gnb-link { color: var(--brand); }
  .gnb-link svg { transition: transform .15s; }
  .gnb-menu > li:hover .gnb-link svg { transform: rotate(180deg); }
  .gnb-drop { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 6px; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; }
  .gnb-menu > li:hover .gnb-drop { opacity: 1; visibility: visible; }
  .gnb-drop ul { display: flex; flex-direction: column; gap: 6px; width: 160px; padding: 6px; border-radius: 12px; background: var(--bg-primary); box-shadow: 0 4px 12px rgba(17, 24, 39, .12); }
  .gnb-drop li { display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: background-color .15s, color .15s; }
  .gnb-drop li:hover { background: #E6F4ED; color: var(--brand); }
  .gnb-user { display: flex; align-items: center; justify-self: end; gap: 4px; }
  .gnb-point { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; border: 1px solid #DDF393; border-radius: 999px; background: #F7FCE9; color: var(--text-secondary); font-size: 12px; font-weight: 500; line-height: 18px; cursor: pointer; }
  .gnb-name { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 14px; font-weight: 500; line-height: 22.4px; color: var(--text-secondary); cursor: pointer; transition: color .15s; }
  .gnb-name:hover { color: var(--brand); }

  /* ===== 목록: 제목 ===== */
  .list-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px; }
  .list-head h2 { font-size: 24px; font-weight: 600; line-height: 33.6px; letter-spacing: 0.12px; color: #000; }
  .list-head p { font-size: 14px; font-weight: 400; line-height: 22.4px; color: var(--text-secondary); }

  /* ===== 목록: 툴바 (필터 / 개수 / 검색 / 정렬) ===== */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .toolbar-left { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; }
  .toolbar-right { display: flex; align-items: center; gap: 8px; }

  .btn-filter {
    display: inline-flex; align-items: center; gap: 4px;
    height: 44px; padding: 0 12px;
    border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-primary);
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
    transition: border-color .15s, background-color .15s;
  }
  .btn-filter:hover { border-color: var(--border-strong); background: var(--bg-secondary); }

  .count { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 22.4px; color: var(--text-secondary); }
  .count strong { font-weight: 500; color: var(--brand); }
  .count button { display: inline-flex; color: var(--text-secondary); }

  .search {
    display: flex; align-items: center; gap: 8px;
    width: 280px; height: 44px; padding: 0 16px;
    border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-primary);
    transition: border-color .15s;
  }
  .search:hover { border-color: var(--border-strong); }
  .search:focus-within { border-color: var(--brand); }
  .search button { display: flex; color: var(--text-tertiary); }
  .search input {
    width: 100%; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 14px; font-weight: 500; color: var(--text-primary);
  }
  .search input::placeholder { color: var(--text-disabled); }

  .select {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 120px; height: 44px; padding: 0 16px;
    border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-primary);
    font-size: 14px; font-weight: 500; color: var(--text-secondary);
  }
  .select:hover { border-color: var(--border-strong); }

  /* ===== 목록: 카드 그리드 ===== */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 24px; }

  .card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
    height: 400px; padding: 20px;
    background: var(--bg-primary); border-radius: 12px;
    border-top: 2px solid var(--school);   /* 학교 시그니처 컬러 */
    overflow: hidden; cursor: pointer;
    transition: transform .3s, box-shadow .3s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 4px 12px rgba(17, 24, 39, .08); }

  .card-top { display: flex; flex-direction: column; gap: 20px; width: 100%; }
  .card-meta { display: flex; flex-direction: column; gap: 8px; }
  .card-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .chip {
    display: inline-flex; align-items: center; height: 28px; padding: 0 12px; min-width: 0;
    border: 1px solid color-mix(in srgb, var(--school) 20%, transparent); border-radius: 4px;
    background: var(--bg-primary); color: var(--school);
    font-size: 14px; font-weight: 500; line-height: 19.6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .heart { display: inline-flex; color: var(--text-disabled); }
  .heart svg { fill: none; }
  .heart.on { color: var(--heart); }
  .heart.on svg { fill: currentColor; }

  .year { font-size: 12px; font-weight: 500; line-height: 18px; color: var(--text-secondary); }

  .card-title-area { display: flex; flex-direction: column; gap: 20px; height: 120px; }   /* 피그마 Card-1: 제목 아래 20px에 상태 배지 */
  .card-title {
    height: 60px; font-size: 20px; font-weight: 600; line-height: 30px; color: var(--text-primary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; height: 20px; }
  /* 시험 상태 배지 (피그마 Card/Small-Badge 기준): 신규 / 추천 / 인기 */
  .s-badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border: 1px solid; border-radius: 4px; font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; }
  .s-badge.new { background: #CAE5FA; color: #0847A6; border-color: rgba(8, 71, 166, .2); }
  .s-badge.rec { background: #E6F4ED; color: #008B48; border-color: rgba(0, 139, 72, .2); }
  .s-badge.hot { background: #FDECCB; color: #E96300; border-color: rgba(233, 99, 0, .2); }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  .info {
    display: flex; flex-direction: column; justify-content: center; gap: 4px; flex-shrink: 0;
    width: 100%; height: 68px; padding: 0 10px;
    background: var(--bg-secondary); border-radius: 8px;
  }
  /* 윗줄: 문제 수 · 시험 시간 · 총점 (간격 16px) / 아랫줄: 작성 분량 */
  .info-row { display: flex; align-items: center; gap: 16px; white-space: nowrap; font-size: 14px; font-weight: 500; line-height: 22.4px; color: var(--text-secondary); }
  .info-row span { display: flex; align-items: center; gap: 4px; }
  .info-row svg { color: var(--text-disabled); }
  .info-len { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .info-len .label { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 18px; color: var(--text-disabled); }
  .info-len .value { font-size: 14px; font-weight: 500; line-height: 22.4px; color: var(--text-secondary); }

  .card-foot { margin-top: auto; width: 100%; padding-top: 19px; border-top: 1px solid var(--border-primary); }
  .card-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; }
  .point { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; line-height: 22.4px; color: var(--text-primary); }
  .btn-primary {
    width: 97px; height: 36px; flex-shrink: 0;
    border-radius: 8px; background: var(--brand); color: #fff;
    font-size: 14px; font-weight: 500;
    transition: background-color .15s;
  }
  .btn-primary:hover { background: var(--brand-hover); }

  /* ===== 상세: 레이아웃 ===== */
  .detail { padding-top: 20px; }

  /* 2단 (인프런 강의 상세 형식 참고): 상단 = 시험 정보 / 좌측 = 탭 / 우측 = 응시 카드 + 이 대학의 다른 시험(스크롤해도 따라옴) */
  .d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "head head" "main side"; column-gap: 24px; align-items: start; }
  .d-side { margin-top: 16px; }   /* 탭 영역(.panel)과 같은 선에서 시작 */
  .d-head { grid-area: head; min-width: 0; }
  .d-main { grid-area: main; min-width: 0; }
  .d-side { grid-area: side; position: sticky; top: 96px; max-height: calc(100vh - 112px); overflow-y: auto; scrollbar-width: none; }

  /* 응시 카드: 필수 정보(찜 · 포인트 · 응시하기 · 시험 구성)만 */
  .take-card { padding: 24px; border-radius: 12px; background: var(--bg-primary); border-top: 2px solid var(--school); }
  .take-top { display: flex; align-items: center; justify-content: space-between; }
  .d-point { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; line-height: 30px; color: var(--text-primary); white-space: nowrap; }
  .d-point svg { width: 30px; height: 30px; }
  .btn-heart { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-disabled); transition: color .15s; }
  .btn-heart:hover { color: var(--text-tertiary); }
  .btn-heart.on:hover { color: var(--heart); }
  .btn-heart svg { fill: none; }
  .btn-heart.on { color: var(--heart); }
  .btn-heart.on svg { fill: currentColor; }
  .btn-take { width: 100%; height: 48px; margin-top: 16px; font-size: 16px; }

  .take-info { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-primary); display: flex; flex-direction: column; gap: 10px; }
  .take-info > div { display: flex; align-items: center; font-size: 14px; line-height: 22.4px; }
  .take-info dt { display: flex; align-items: center; gap: 6px; width: 112px; flex-shrink: 0; color: var(--text-tertiary); }
  .take-info dt svg { color: var(--text-disabled); }
  .take-info dd { font-weight: 500; color: var(--text-primary); }

  /* 기획 확인용 안내 (실제 화면에는 없음) */
  .proto-note { margin-bottom: 16px; padding: 8px 12px; border: 1px dashed #C4B5FD; border-radius: 8px; background: #F5F3FF; color: #5B21B6; font-size: 13px; line-height: 20px; }

  .detail-meta { display: flex; align-items: center; gap: 12px; }
  .detail-meta .year { font-size: 14px; line-height: 19.6px; }
  .detail-title { margin-top: 14px; font-size: 28px; font-weight: 700; line-height: 38px; letter-spacing: -0.3px; }

  /* 문제 특징: 제목 아래 설명글 (피그마 Dialog-More 기준) */
  .feature { margin-top: 6px; font-size: 15px; font-weight: 400; line-height: 24px; color: var(--text-secondary); }

  /* ===== 상세: 탭 ===== */
  .panel { margin-top: 16px; background: var(--bg-primary); border-radius: 12px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border-primary); padding: 0 4px; position: sticky; top: 80px; z-index: 20; background: var(--bg-primary); border-radius: 12px 12px 0 0; }
  .tab {
    position: relative; flex: 0 0 25%; display: flex;   /* 탭 수가 줄어도 폭은 그대로(왼쪽부터 채움) */ align-items: center; justify-content: center; gap: 6px;
    height: 52px; font-size: 15px; font-weight: 500; color: var(--text-secondary);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab + .tab::before { content: ""; position: absolute; left: 0; top: 18px; height: 16px; width: 1px; background: var(--border-primary); }
  .tab:hover { color: var(--text-primary); }
  .tab.on { color: var(--brand); font-weight: 700; border-bottom-color: var(--brand); }
  /* 자료 미등록 → 비활성 (잠금과 구분: 자물쇠 없음 + 흐린 글자 + '준비 중' 표시) */
  .tab.disabled { color: #C5CAD3; cursor: not-allowed; }
  .tab.disabled:hover { color: #C5CAD3; }
  .tab .soon { padding: 1px 6px; border-radius: 4px; background: #F3F4F6; color: var(--text-disabled); font-size: 11px; font-weight: 500; }
  .tab[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 5;
    padding: 6px 10px; border-radius: 6px; background: #1F2937; color: #fff; font-size: 12px; font-weight: 400; white-space: nowrap;
  }

  .tab-body { padding: 28px 24px 32px; }
  /* 섹션 제목: 번호 대신 왼쪽 초록 포인트 바 */
  .sec-title { display: flex; align-items: center; gap: 8px; margin: 36px 0 14px; font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: -0.2px; color: var(--text-primary); }
  .sec-title::before { content: ""; width: 3px; height: 15px; border-radius: 2px; background: var(--brand); }
  .sec-title:first-child { margin-top: 0; }
  .body-text { font-size: 15px; line-height: 26px; color: var(--text-secondary); }

  .kv-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kv { border: 1px solid var(--border-primary); border-radius: 8px; overflow: hidden; font-size: 14px; }
  .kv > div { display: flex; align-items: center; min-height: 40px; }
  .kv > div + div { border-top: 1px solid var(--border-primary); }
  .kv dt { display: flex; align-items: center; gap: 10px; align-self: stretch; width: 140px; flex-shrink: 0; padding: 0 16px; background: var(--bg-secondary); color: var(--text-secondary); }
  .kv dt svg { color: var(--text-tertiary); }
  .kv dd { padding: 0 16px; color: var(--text-primary); }
  .kv dd.strong { font-weight: 600; }
  .kv dd small { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--text-tertiary); }

  .tbl { width: 100%; border: 1px solid var(--border-primary); border-radius: 8px; border-collapse: separate; border-spacing: 0; overflow: hidden; font-size: 14px; }
  .tbl th, .tbl td { height: 40px; padding: 8px 16px; text-align: center; border-top: 1px solid var(--border-primary); }
  .tbl th + th, .tbl td + td { border-left: 1px solid var(--border-primary); }
  .tbl thead th { border-top: 0; background: var(--bg-secondary); font-weight: 500; color: var(--text-secondary); }
  .tbl tbody th { font-weight: 600; background: #FCFCFD; }
  .tbl td.left { text-align: left; color: var(--text-secondary); line-height: 22px; }

  .note-box { padding: 14px 20px; border-radius: 8px; background: var(--bg-secondary); }
  .dots li { position: relative; padding-left: 16px; font-size: 14px; line-height: 26px; color: var(--text-secondary); }
  .dots li::before { content: ""; position: absolute; left: 3px; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  .q-block { padding: 18px 20px; border: 1px solid var(--border-primary); border-radius: 10px; }
  .q-block + .q-block { margin-top: 12px; }
  .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .q-head b { font-size: 16px; font-weight: 700; }
  .q-badge { padding: 2px 8px; border-radius: 4px; background: var(--brand-subtle); color: var(--brand); font-size: 12px; font-weight: 600; }
  .q-meta { margin-left: auto; font-size: 13px; color: var(--text-tertiary); }
  .q-sub { margin: 12px 0 4px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .q-block .tbl { margin-top: 4px; }

  /* ===== 상세: 버튼 / 태그 / 이 대학의 다른 시험 ===== */
  .btn-lg { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 8px; font-size: 15px; font-weight: 600; transition: background-color .15s, border-color .15s; }
  .btn-lg.solid { background: var(--brand); color: #fff; }
  .btn-lg.solid:hover { background: var(--brand-hover); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border: 1px solid var(--border-primary); border-radius: 8px; background: var(--bg-primary); font-size: 14px; color: var(--text-secondary); }
  .chip { gap: 6px; flex-shrink: 0; }
  .ai-mark { display: inline-flex; align-items: center; gap: 1px; }

  /* 이 대학의 다른 시험: 우측 응시 카드 아래 (학교 칩 + 학년도 / 시험 제목), 데이터 있을 때만 */
  .rel-card { margin-top: 16px; padding: 20px 12px 12px; border-radius: 12px; background: var(--bg-primary); }
  .rel-card h2 { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 16px; font-weight: 700; }
  .related { margin-top: 8px; }
  .related li { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background-color .15s; }
  .related li:hover { background: #E6F4ED; }
  .related-meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .related-title { font-size: 15px; font-weight: 500; line-height: 24px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== 반응형 ===== */
  @media (max-width: 1279px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 1023px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search { flex: 1; width: auto; }
    .gnb-menu { display: none; }
    .d-grid { grid-template-columns: 1fr; grid-template-areas: "head" "side" "main"; }
    .d-side { position: static; max-height: none; margin-top: 20px; }
  }
  @media (max-width: 639px) {
    .container { padding: 50px 16px 48px; }
    .detail { padding-top: 12px; }
    .gnb-inner { grid-template-columns: auto 1fr; padding: 0 16px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .detail-title { font-size: 24px; line-height: 34px; }
    .tabs { overflow-x: auto; }
    .tab { flex: 0 0 auto; padding: 0 16px; }
  }
</style>
</head>
<body>

<header class="gnb">
  <div class="gnb-inner">
    <div class="logo">

  const POINT_SVG = '<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="15" fill="#008B48"/><mask id="pm" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="30" height="30"><circle cx="15" cy="15" r="15" fill="#008B48"/></mask><g mask="url(#pm)"><circle cx="14.9999" cy="26.6891" r="17.1" fill="#B5E82A"/></g><circle cx="10.9587" cy="19.1782" r="2.60274" fill="white"/><circle cx="10.9589" cy="19.1781" r="1.91781" fill="#008B48"/><circle cx="11.9179" cy="18.6302" r="0.410959" fill="white"/><circle cx="18.904" cy="19.1782" r="2.60274" fill="white"/><circle cx="18.9043" cy="19.1781" r="1.91781" fill="#008B48"/><circle cx="19.8632" cy="18.6302" r="0.410959" fill="white"/><path d="M13.6987 21.7808C14.1192 22.0909 15.2011 22.525 16.1645 21.7808" stroke="#008B48" stroke-width="0.365297" stroke-linecap="round"/><ellipse cx="13.4932" cy="9.24651" rx="1.71233" ry="1.71233" transform="rotate(90 13.4932 9.24651)" fill="#B5E82A"/><ellipse cx="16.3697" cy="9.24651" rx="1.71233" ry="1.71233" transform="rotate(90 16.3697 9.24651)" fill="#B5E82A"/></svg>';

      else {
        const base = Math.floor(TOTAL_SCORE / n / 50) * 50;
        score = i === n - 1 ? TOTAL_SCORE - base * (n - 1) : base;   // 남는 점수는 마지막 문제에
      }
      const [min, max] = e.lens[i];
      return { no: i + 1, score, len: `${num(min)} ~ ${num(max)}자`, type: Q_TYPES[types[i]] };
    });
  }

  function examState(e) {
    const docs = Object.assign({ intent: true, explain: true, rubric: true }, e.docs);
    return { docs };
  }

  // 탭 한 개의 상태: on(열람 가능) / disabled(자료 미등록)
  function tabStatus(key, st) {
    if (key === 'overview') return 'on';
    if (!st.docs[key]) return 'disabled';
    return 'on';
  }

  function openDetail(e) {
    current = e;
    currentTab = 'overview';
    renderDetail();
    $list.hidden = true;
    $detail.hidden = false;
    window.scrollTo(0, 0);
  }
  function openList() {
    $grid.innerHTML = EXAMS.map(cardHTML).join('');
    $detail.hidden = true;
    $list.hidden = false;
    window.scrollTo(0, 0);
  }

  function renderDetail() {
    const e = current, th = THEMES[e.theme], st = examState(e), qs = buildQuestions(e);
    const examType = e.title.includes('모의') ? '모의논술' : '기출 논술';
    const baseTitle = e.title;

    // 자료가 없는 탭은 아예 비노출. '시험 개요' 탭은 항상 노출 (하나만 남아도 탭 줄 유지)
    const shownTabs = TABS.filter(t => tabStatus(t.key, st) === 'on');
    const tabsHTML = `<div class="tabs" role="tablist">${shownTabs.map(t => `<button type="button" class="tab${t.key === currentTab ? ' on' : ''}" data-tab="${t.key}">${t.label}</button>`).join('')}</div>`;

    // 기획 확인용 상태 설명
    const missing = TABS.filter(t => tabStatus(t.key, st) === 'disabled').map(t => t.label);
    const stateText = [
      missing.length ? `자료 미등록(탭 비노출): ${missing.join(', ')}` : '모든 자료 등록됨',
      e.noMeta ? '문제 특징·교과·개념·이 대학의 다른 시험 없음' : (e.noRelated ? '이 대학의 다른 시험 없음' : ''),
    ].filter(Boolean).join(' · ');

    // 이 대학의 다른 시험: 같은 대학의 다른 학년도 기출문제 + 기출변형 (noMeta 시험은 없음)
    const related = (e.noMeta || e.noRelated) ? [] : [
      { year: e.year + 1 },
      { year: e.year + 1, ai: true },
      { year: e.year - 1 },
      { year: e.year - 2 },
    ];
    const feature = e.noMeta ? '' : th.feature;
    const chip = `<span class="chip">${e.ai ? AI_MARK : ''}${e.school}</span>`;
    // 찜(하트)은 로그인 상태에서만 노출 (비로그인 시 비노출 예정)
    const heartBtn = `<button type="button" class="btn-heart${e.liked ? ' on' : ''}" aria-label="찜하기">${ic('heart', 24, 1.5)}</button>`;

    $detail.style.setProperty('--school', e.color);
    $detail.innerHTML = `
      <div class="proto-note">기획 확인용 (실제 화면에는 없음) — 이 시험의 상태: <b>${stateText}</b></div>


      <div class="d-grid">
        <!-- 좌측 상단: 시험 정보 -->
        <header class="d-head">
          <div class="detail-meta">${chip}<span class="year">${e.year}학년도</span></div>
          <h1 class="detail-title">${e.title}</h1>
          ${feature ? `<p class="feature">${feature}</p>` : ''}
          ${e.tags && e.tags.length ? `<div class="detail-tags">${tagsHTML(e)}</div>` : ''}
        </header>

        <!-- 우측: 응시 카드 -->
        <aside class="d-side">
          <div class="take-card">
            <div class="take-top">
              <span class="d-point">${POINT_SVG}${e.point}개</span>
              ${heartBtn}
            </div>
            <button type="button" class="btn-lg solid btn-take">응시하기</button>
            <dl class="take-info">
              <div><dt>${ic('file')}문제 수</dt><dd>${e.questions}문제</dd></div>
              <div><dt>${ic('clock')}시험 시간</dt><dd>${e.minutes}분</dd></div>
              <div><dt>${ic('pencil')}작성 분량</dt><dd>${e.length}</dd></div>
              <div><dt>${ic('gradCap')}총점</dt><dd>${num(TOTAL_SCORE)}점</dd></div>
            </dl>
          </div>
          <!-- 이 대학의 다른 시험 (있을 때만 노출) -->
          ${related.length ? `<section class="rel-card">
            <h2>이 대학의 다른 시험</h2>
            <ul class="related">
              ${related.map((r, i) => `<li data-rel="${i}">
                <div class="related-meta"><span class="chip">${r.ai ? AI_MARK : ''}${e.school}</span><span class="year">${r.year}학년도</span></div>
                <p class="related-title">${baseTitle}</p>
              </li>`).join('')}
            </ul>
          </section>` : ''}
        </aside>

        <!-- 좌측: 탭 -->
        <div class="d-main">
          <div class="panel">
            ${tabsHTML}
            <div class="tab-body">${tabBody(currentTab, e, th, st, qs, examType)}</div>
          </div>

        </div>
      </div>`;
    $detail._related = related;

  }

  function tabBody(key, e, th, st, qs, examType) {
    if (key === 'overview') {
      const meta = !e.noMeta;
      return `
      ${meta ? `<h2 class="sec-title">관련 교과</h2>
      <div class="pills">${th.subjects.map(x => `<span class="pill">${x}</span>`).join('')}</div>
      <h2 class="sec-title">핵심 개념</h2>
      <div class="pills">${th.concepts.map(x => `<span class="pill">${x}</span>`).join('')}</div>` : ''}
      <h2 class="sec-title">문제 구성</h2>
      <table class="tbl">
        <thead><tr><th style="width:24%">문제</th><th style="width:34%">대학 기준 점수</th><th>적정 분량</th></tr></thead>
        <tbody>${qs.map(q => `<tr><th>문제 ${q.no}</th><td>${num(q.score)}점</td><td>${q.len}</td></tr>`).join('')}</tbody>
      </table>
      <h2 class="sec-title">출제 범위 및 유의사항</h2>
      <div class="note-box"><ul class="dots">
        <li>제시문을 바탕으로 자신의 견해를 논리적으로 구성하여 논술하는 문제입니다.</li>
        <li>제시문은 인문·사회 전반의 주제를 다루며, 자료의 해석과 비판적 사고가 요구됩니다.</li>
        <li>문제별 요구되는 분량을 준수하여 답안을 작성하시기 바랍니다.</li>
        <li>표절, 무단 인용 등 부정행위가 확인될 경우 채점에서 불이익이 있을 수 있습니다.</li>
        <li>제시된 정보는 문제 이해를 돕기 위한 참고 자료이며, 실제 시험과 일부 차이가 있을 수 있습니다.</li>
        ${examType === '모의논술' ? '<li>실제 대학의 출제 경향을 반영한 모의논술로, 대학의 공식 출제 자료가 아닙니다.</li>' : ''}
      </ul></div>`;
    }

    if (key === 'intent') return `
      <h2 class="sec-title">출제 방향</h2>
      <p class="body-text">이 시험은 ‘${th.topic}’을(를) 중심 주제로, 고등학교 교육과정에서 다루는 개념을 바탕으로 제시문을 정확히 읽고 논리적으로 사고하는 능력을 종합적으로 평가하고자 출제되었습니다. 특정 배경지식의 유무보다 제시문에 대한 이해와 이를 근거로 한 논증의 타당성을 중점적으로 확인합니다.</p>
      <h2 class="sec-title">문제별 출제의도</h2>
      ${qs.map(q => `<div class="q-block"><div class="q-head"><b>문제 ${q.no}</b><span class="q-badge">${q.type.name}</span><span class="q-meta">${num(q.score)}점 · ${q.len}</span></div><p class="body-text">${q.type.intent}</p></div>`).join('')}
      <h2 class="sec-title">교육과정 연계</h2>
      <div class="note-box"><ul class="dots">${th.subjects.slice(0, 4).map(s => `<li><b>${s}</b> 교과의 성취기준과 연계하여 출제되었습니다.</li>`).join('')}</ul></div>`;

    if (key === 'explain') return `
      <p class="body-text" style="margin-bottom:16px">문제와 제시문은 응시 화면에서 확인할 수 있으며, 여기서는 문제 유형별 접근 방법만 안내합니다.</p>
      ${qs.map(q => `<div class="q-block">
        <div class="q-head"><b>문제 ${q.no}</b><span class="q-badge">${q.type.name}</span><span class="q-meta">${num(q.score)}점 · ${q.len}</span></div>
        <p class="q-sub">접근 방법</p><p class="body-text">${q.type.how}</p>
        <p class="q-sub">자주 하는 실수</p><p class="body-text">${q.type.miss}</p>
      </div>`).join('')}`;

    if (key === 'rubric') return qs.map(q => {
      const a = Math.round(q.score * 0.4 / 10) * 10, b = a, c = q.score - a - b;
      return `<div class="q-block">
        <div class="q-head"><b>문제 ${q.no}</b><span class="q-badge">${q.type.name}</span><span class="q-meta">${num(q.score)}점 만점</span></div>
        <table class="tbl">
          <thead><tr><th style="width:22%">평가 항목</th><th>세부 기준</th><th style="width:16%">배점</th></tr></thead>
          <tbody>
            <tr><th>이해·분석</th><td class="left">제시문의 핵심 논지를 정확히 파악하고 문제의 요구 사항에 맞게 분석하였는가</td><td>${a}점</td></tr>
            <tr><th>논증·구성</th><td class="left">주장과 근거가 타당하게 연결되며 글의 전개가 논리적으로 구성되었는가</td><td>${b}점</td></tr>
            <tr><th>표현·분량</th><td class="left">문장이 명료하고 어문 규범을 지켰으며 적정 분량(${q.len})을 준수하였는가</td><td>${c}점</td></tr>
          </tbody>
        </table>
      </div>`;
    }).join('');

  }

  // 상세 화면 안의 클릭 처리
  $detail.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-go="list"]')) { openList(); return; }
    const tab = ev.target.closest('.tab[data-tab]');
    if (tab) {
      currentTab = tab.dataset.tab; renderDetail();
      const top = $detail.querySelector('.panel').getBoundingClientRect().top;
      if (top < 80) window.scrollBy(0, top - 80);              // 탭이 붙어 있는 상태면 내용 맨 위로
      return;
    }
    if (ev.target.closest('.btn-heart')) {                       // 찜 토글 (목록 카드에도 반영)
      current.liked = !current.liked;
      $detail.querySelectorAll('.btn-heart').forEach(b => b.classList.toggle('on', current.liked));
      return;
    }
    const rel = ev.target.closest('[data-rel]');
    if (rel) {                                                   // 이 대학의 다른 시험 → 그 문제의 상세보기로 이동
      const r = $detail._related[rel.dataset.rel];
      openDetail(Object.assign({}, current, { tags: [], year: r.year, ai: !!r.ai, docs: undefined, noRelated: false, liked: false }));
    }
  });
  document.querySelector('.gnb [data-go="list"]').addEventListener('click', openList);
  document.querySelector('.logo').addEventListener('click', openList);
</script>
</body>
</html>
